version: 1
stage: M1
task: qwen3_0_6b_math_sft
created_at: "2026-06-09"

selected_source: hendrycks_math
fallback_source: gsm8k

sources:
  - name: gsm8k
    source_url: "https://huggingface.co/datasets/openai/gsm8k"
    license:
      name: "MIT"
      url: "TODO"
      redistribution_allowed: true
      commercial_use: true
    download:
      access_method: "huggingface_datasets"
      requires_auth: false
      local_cache_path: "data/math/sources/gsm8k"
    fields:
      problem: "question"
      solution: "answer contains reasoning and final numeric answer"
      answer: "final answer parsed from answer field"
      level: null
      domain: "grade_school_math"
    answer_format:
      raw: "reasoning text with final answer marker"
      extraction_rule: "parse final numeric answer"
    pros:
      - "答案多为数值，适合自动判分"
      - "难度较低，适合 0.6B baseline 和 sanity"
    risks:
      - "没有 level 字段，难度筛选能力弱"
      - "推理格式和 M1 目标格式不一致，需要转换"

  - name: openr1_math_220k
    source_url: "https://huggingface.co/datasets/open-r1/OpenR1-Math-220k"
    license:
      name: "Apache-2.0"
      url: "TODO"
      redistribution_allowed: true
      commercial_use: true
    download:
      access_method: "huggingface_datasets"
      requires_auth: false
      local_cache_path: "data/math/sources/openr1_math_220k"
    fields:
      problem: "problem"
      solution: "solution"
      answer: "answer"
      reasoning: "generations"
      level: null
      domain: "problem_type"
      source: "source"
      verified: "verified"
    answer_format:
      raw: "answer field"
      extraction_rule: "use answer field directly when parseable"
    pros:
      - "样本量大"
      - "包含已验证 reasoning traces"
      - "有 answer 字段，便于构造 SFT target"
    risks:
      - "reasoning traces 来自模型生成，可能引入风格偏置"
      - "样本规模大，D2 需要严格小规模抽样"
      - "字段和 generations 结构需要实际抽查"

  - name: hendrycks_math
    source_url: "https://huggingface.co/datasets/EleutherAI/hendrycks_math"
    license:
      name: "MIT"
      url: "TODO"
      redistribution_allowed: true
      commercial_use: true
    download:
      access_method: "huggingface_datasets"
      requires_auth: false
      local_cache_path: "data/math/sources/hendrycks_math"
    fields:
      problem: "problem"
      solution: "solution"
      answer: "parsed from \\boxed{} in solution"
      level: "level"
      domain: "type"
    answer_format:
      raw: "final answer is usually wrapped by \\boxed{} in solution"
      extraction_rule: "parse \\boxed{} from solution"
    pros:
      - "有 level 字段，便于筛选难度"
      - "有 type 字段，便于控制领域分布"
      - "solution 中通常有 \\boxed{}，和 M1 目标格式一致"
    risks:
      - "题目偏难，0.6B baseline 可能较低"
      - "答案需要从 solution 中抽取，可能存在解析失败"
      - "部分题目可能过长或包含复杂 LaTeX"

filter_rules:
  selected_source: hendrycks_math
  level_range: [1, 3]
  allowed_domains:
    - prealgebra
    - algebra
    - counting_and_probability
    - number_theory
  answer_types:
    preferred:
      - integer
      - fraction
      - decimal
    excluded:
      - proof
      - expression_with_multiple_equivalent_forms
      - geometry_diagram_dependent
  deduplication:
    key: "normalized_problem"
  max_problem_chars: 2000
  max_solution_chars: 4000
  require_extractable_answer: true

splits:
  train:
    path: "data/math/splits/train.jsonl"
    ratio: 0.7
  val:
    path: "data/math/splits/val.jsonl"
    ratio: 0.1
  test:
    path: "data/math/splits/test.jsonl"
    ratio: 0.1
  review:
    path: "data/math/splits/review.jsonl"
    ratio: 0.1

expected_counts:
  raw_subset: 300
  train: 210
  val: 30
  test: 30
  review: 30

manual_review:
  required_raw_samples: 30
  required_review_samples: 20
  check_items:
    - "problem is readable"
    - "answer is extractable"
    - "solution matches answer"
    - "sample does not require image"
    - "length is suitable for M1"
