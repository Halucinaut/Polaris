run:
  name: "qwen3_0_6b_grpo_math"
  tags: ["grpo", "math", "0.6b"]

model:
  name: "Qwen3-0.6B"
  path: "models/qwen3_0_6b/mlx"

data:
  name: "math_level_3_5"
  path: "data/math/splits/math_level_3_5.jsonl"
  max_samples: 1000

training:
  method: "grpo"
  num_epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-6
  max_seq_length: 2048
  seed: 42

grpo:
  # M2.5 starts both policy and frozen reference from the validated M1 state.
  policy_adapter_path: "runs/000030_qwen3_0_6b_sft_gsm8k_500/checkpoints/final"
  ref_model_path: "models/qwen3_0_6b/mlx"
  ref_adapter_path: "runs/000030_qwen3_0_6b_sft_gsm8k_500/checkpoints/final"

  # Rollout
  group_size: 8
  max_completion_length: 256
  rollout_temperature: 1.0
  rollout_top_p: 1.0
  rollout_seed: 42

  # GRPO objective
  clip_range: 0.2
  kl_coef: 0.05

  # Reward shaping
  reward:
    correct: 1.0
    incorrect: 0.0
    unparseable: -0.5
    empty: -1.0
    format_bonus: 0.05

lora:
  enabled: true
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

eval:
  dataset: "math_level_3_5"
  max_samples: 200
  metrics: ["pass_at_1", "invalid_output_rate", "avg_completion_length"]
