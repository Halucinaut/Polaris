# SFT v2 Style Control: M1 adapter initialization feasibility test
# Purpose: test if SFT can learn DPO v2 style template from M1 adapter init
# NOT a fair DPO-vs-SFT comparison (different lr and objective)

run:
  name: qwen3_0_6b_sft_v2_style_control
  description: "SFT style control: init from M1 adapter, train on DPO v2 chosen style"
  tags: [sft, math, 0.6b, v2, style, control]

model:
  path: models/qwen3_0_6b/mlx

data:
  path: data/math/splits/sft_v2_style_control_train_449.jsonl

sft:
  init_adapter_path: runs/000030_qwen3_0_6b_sft_gsm8k_500/checkpoints/final

training:
  method: sft
  num_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  max_seq_length: 2048
  seed: 42

lora:
  enabled: true
  r: 32
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
