run:
  name: "qwen3_0_6b_dpo_math"
  tags: ["dpo", "math", "0.6b"]

model:
  name: "Qwen3-0.6B"
  path: "models/qwen3_0_6b/mlx"

data:
  name: "gsm8k_dpo_v1"
  path: "data/math/splits/dpo_v1.jsonl"
  max_samples: null

training:
  method: "dpo"
  num_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-7
  max_seq_length: 2048
  seed: 42

dpo:
  beta: 0.1
  ref_checkpoint: "models/qwen3_0_6b/mlx"

lora:
  enabled: true
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
